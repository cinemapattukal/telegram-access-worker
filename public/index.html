<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0,maximum-scale=1.0"
>

<title>a2z Malayalam Songs</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #111827;
}

.container {
  width: 100%;
  max-width: 430px;
  margin: auto;
  padding: 25px 18px;
}

.card {
  background: white;
  border-radius: 22px;
  padding: 25px 20px;
  box-shadow: 0 8px 30px rgba(0,0,0,.08);
}

.logo {
  width: 80px;
  height: 80px;
  margin: 0 auto 15px;
  border-radius: 20px;
  background: #229ed9;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 30px;
  font-weight: bold;
}

h1 {
  text-align: center;
  font-size: 25px;
  margin: 5px 0 8px;
}

.subtitle {
  text-align: center;
  color: #6b7280;
  font-size: 14px;
  margin-bottom: 25px;
}

label {
  display: block;
  font-size: 14px;
  font-weight: 600;
  margin: 15px 0 7px;
}

input {
  width: 100%;
  height: 48px;
  border: 1px solid #d7dce5;
  border-radius: 12px;
  padding: 0 14px;
  font-size: 15px;
  outline: none;
}

input:focus {
  border-color: #229ed9;
}

button {
  width: 100%;
  height: 50px;
  border: 0;
  border-radius: 13px;
  margin-top: 22px;
  background: #229ed9;
  color: white;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
}

.status {
  margin-top: 15px;
  padding: 12px;
  border-radius: 10px;
  display: none;
  font-size: 14px;
  text-align: center;
}

.error {
  display: block;
  background: #fee2e2;
  color: #991b1b;
}

.success {
  display: block;
  background: #dcfce7;
  color: #166534;
}

.login-box {
  text-align: center;
  padding: 15px;
}

.login-box p {
  color: #6b7280;
  font-size: 14px;
}

</style>

</head>

<body>

<div class="container">

  <div class="card">

    <div class="logo">
      A2Z
    </div>

    <h1>
      Create Account
    </h1>

    <div class="subtitle">
      a2z Malayalam Songs
    </div>

    <div class="login-box" id="telegramStatus">
      Checking Telegram login...
    </div>

    <form id="registerForm">

      <label>
        Name
      </label>

      <input
        id="name"
        type="text"
        placeholder="Enter your name"
        required
      >

      <label>
        Phone
      </label>

      <input
        id="phone"
        type="tel"
        placeholder="Enter phone number"
        required
      >

      <label>
        Email
      </label>

      <input
        id="email"
        type="email"
        placeholder="Enter email"
      >

      <button
        id="createBtn"
        type="submit"
      >
        Create Account
      </button>

    </form>

    <div
      id="status"
      class="status"
    ></div>

  </div>

</div>

<script>

const tg = window.Telegram?.WebApp;

if (tg) {
  tg.ready();
  tg.expand();
}

const statusBox =
  document.getElementById("status");

const telegramStatus =
  document.getElementById("telegramStatus");

const form =
  document.getElementById("registerForm");

const button =
  document.getElementById("createBtn");

function showStatus(message, type) {

  statusBox.textContent = message;

  statusBox.className =
    "status " + type;
}

function telegramInitData() {

  if (!tg) {
    return "";
  }

  return tg.initData || "";
}

async function api(path, options = {}) {

  const initData =
    telegramInitData();

  const headers = {
    "content-type":
      "application/json",

    "X-Telegram-Init-Data":
      initData
  };

  const response =
    await fetch(
      path,
      {
        ...options,
        headers: {
          ...headers,
          ...(options.headers || {})
        }
      }
    );

  return await response.json();
}

async function checkLogin() {

  if (!tg) {

    telegramStatus.innerHTML =
      "Please open this page inside Telegram.";

    button.disabled = true;

    return;
  }

  if (!tg.initData) {

    telegramStatus.innerHTML =
      "Telegram login data not available.";

    button.disabled = true;

    return;
  }

  try {

    const result =
      await api("/api/me");

    if (
      result.ok &&
      result.user
    ) {

      telegramStatus.innerHTML =
        "Telegram account connected.";

      if (result.user.name) {
        document.getElementById("name").value =
          result.user.name;
      }

      if (result.user.phone) {
        document.getElementById("phone").value =
          result.user.phone;
      }

      if (result.user.email) {
        document.getElementById("email").value =
          result.user.email;
      }

      button.disabled = false;

    } else {

      telegramStatus.innerHTML =
        "Telegram account connected. Create your account.";

      button.disabled = false;
    }

  } catch (error) {

    telegramStatus.innerHTML =
      "Unable to connect to server.";

    button.disabled = true;

  }
}

form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    const name =
      document
        .getElementById("name")
        .value
        .trim();

    const phone =
      document
        .getElementById("phone")
        .value
        .trim();

    const email =
      document
        .getElementById("email")
        .value
        .trim();

    if (!name || !phone) {

      showStatus(
        "Name and phone are required.",
        "error"
      );

      return;
    }

    button.disabled = true;

    button.textContent =
      "Creating...";

    try {

      const result =
        await api(
          "/api/register",
          {
            method: "POST",

            body:
              JSON.stringify({
                name,
                phone,
                email
              })
          }
        );

      if (result.ok) {

        showStatus(
          "Account created successfully!",
          "success"
        );

        button.textContent =
          "Account Created";

        if (tg) {

          setTimeout(() => {
            tg.close();
          }, 1500);

        }

      } else {

        showStatus(
          result.error ||
          "Account creation failed.",
          "error"
        );

        button.disabled = false;

        button.textContent =
          "Create Account";
      }

    } catch (error) {

      showStatus(
        "Server connection failed.",
        "error"
      );

      button.disabled = false;

      button.textContent =
        "Create Account";
    }
  }
);

checkLogin();

</script>

</body>
</html>
